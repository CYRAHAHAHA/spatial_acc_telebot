name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Amazon Linux 2023
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Create .env file
        run: |
          cat > .env << EOF
          # Autodesk Configuration
          YR_CLIENT_ID=${{ secrets.CLIENT_ID }}
          YR_CLIENT_SECRET=${{ secrets.CLIENT_SECRET }}
          YR_REDIRECT_URI=${{ secrets.REDIRECT_URI }}
          YR_SCOPES=${{ secrets.SCOPES }}
          YR_PROJECT_ID=${{ secrets.PROJECT_ID }}

          # Telegram Configuration
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          SITE_UPDATES_TOKEN=${{ secrets.SITE_UPDATES_TOKEN }}
          FLASK_BASE=http://localhost:8080
          EOF

      - name: Deploy files to EC2
        run: |
          rsync -avz --delete \
            --exclude 'venv/' \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            --exclude '.DS_Store' \
            --exclude 'logs/' \
            --exclude 'root/autodesk_tokens.json' \
            --exclude 'telebot/autodesk_tokens.json' \
            --exclude 'telebot/site_updates.json' \
            --exclude 'telebot/logs/' \
            --exclude 'root/data/*.csv' \
            -e "ssh -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/

      - name: Upload .env file separately
        run: |
          scp -i ~/.ssh/deploy_key.pem -o StrictHostKeyChecking=no \
            .env ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/.env

      - name: Run deployment script on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            chmod +x *.sh
            ./deploy_refresh.sh

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            ./status.sh

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem
          rm -f .env
